<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="rm_clip"><circle cx="100" cy="100" r="90"/></clipPath>
  </defs>
  <!-- Outer border -->
  <circle cx="100" cy="100" r="98" fill="#041E42"/>
  <!-- Gold ring -->
  <circle cx="100" cy="100" r="91" fill="#F7D300"/>
  <!-- White field -->
  <circle cx="100" cy="100" r="83" fill="#FFFFFF"/>
  <!-- Blue lower band clipped to circle -->
  <rect x="10" y="140" width="180" height="60" fill="#041E42" clip-path="url(#rm_clip)"/>
  <!-- Crown -->
  <polygon points="62,72 72,52 88,64 100,48 112,64 128,52 138,72 128,80 100,72 72,80" fill="#F7D300"/>
  <!-- Crown base bar -->
  <rect x="68" y="76" width="64" height="10" rx="3" fill="#041E42"/>
  <!-- Crown jewels -->
  <circle cx="100" cy="50" r="5" fill="#C41E3A"/>
  <circle cx="76" cy="56" r="3.5" fill="#C41E3A"/>
  <circle cx="124" cy="56" r="3.5" fill="#C41E3A"/>
  <!-- RM text -->
  <text x="100" y="128" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="38" fill="#041E42">RM</text>
  <!-- Bottom label -->
  <text x="100" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#F7D300">REAL MADRID</text>
</svg>
