<?xml version="1.0" encoding="UTF-8"?>
<!--
  Template head for Soccer Headz.

  Canvas is 192 x 256 to match PlayerController.PlaceholderWidth/Height, so an SVG head
  is a DROP-IN replacement for the procedural one and the kicking foot still orbits the
  same head centre. Keep the head inside roughly x:[14,178], y:[8,156] (the top ~58% of
  the canvas) and leave the rest transparent.

  To use: copy this file (e.g. Assets/Heads/bellingham.svg), redraw the face/skin/hair,
  open the project once in the Godot editor so it imports, then point a variant at it in
  ClubDatabase, e.g.:
      new PlayerVariant("Bellingham", SkinLight, HairBrown, "res://Assets/Heads/bellingham.svg")
  The picker thumbnail and the in-match avatar both pick it up automatically; the body
  collider auto-sizes to the sprite.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="256" viewBox="0 0 192 256">
  <!-- head: rounded rectangle, black outline -->
  <rect x="14" y="8" width="164" height="148" rx="22" ry="22"
        fill="#d9a06b" stroke="#000000" stroke-width="5"/>
  <!-- hair cap across the top third, clipped to the head -->
  <clipPath id="headClip">
    <rect x="14" y="8" width="164" height="148" rx="22" ry="22"/>
  </clipPath>
  <rect x="14" y="8" width="164" height="48" fill="#2a1c12" clip-path="url(#headClip)"/>
  <!-- eyes -->
  <g>
    <circle cx="72"  cy="92" r="17" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="120" cy="92" r="17" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <circle cx="75"  cy="94" r="8"  fill="#1a120a"/>
    <circle cx="123" cy="94" r="8"  fill="#1a120a"/>
    <circle cx="71"  cy="89" r="3"  fill="#ffffff"/>
    <circle cx="119" cy="89" r="3"  fill="#ffffff"/>
  </g>
  <!-- nose + mouth -->
  <ellipse cx="96" cy="118" rx="6" ry="4" fill="#00000022"/>
  <rect x="80" y="132" width="32" height="6" rx="3" fill="#7a1f1f"/>
</svg>
