<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy background -->
  <circle cx="50" cy="50" r="48" fill="#1A237E"/>
  <circle cx="50" cy="50" r="44" fill="#283593"/>
  <!-- Dashed outer ring (original size reference) -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#7986CB" stroke-width="2.5" stroke-dasharray="5,3"/>
  <!-- Solid big circle (enlarged player) -->
  <circle cx="50" cy="50" r="22" fill="#E8EAF6"/>
  <!-- Silhouette of big head in circle -->
  <circle cx="50" cy="43" r="9" fill="#283593"/>
  <rect x="38" y="52" width="24" height="14" rx="5" fill="#283593"/>
  <!-- Corner expand arrows -->
  <polygon points="14,14 24,14 14,24" fill="#FFD600"/>
  <polygon points="86,14 76,14 86,24" fill="#FFD600"/>
  <polygon points="14,86 24,86 14,76" fill="#FFD600"/>
  <polygon points="86,86 76,86 86,76" fill="#FFD600"/>
</svg>
